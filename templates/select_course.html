<!DOCTYPE html>
<html lang="en">
<head>
  <title>Course Selection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f2f2f2;
    }

    .topnav {
      background-color: #2710ba;
      padding: 0px 20px;
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .topnav .logo {
      font-weight: bold;
      font-size: 18px;
    }

    .topnav .nav-links a {
      color: #fff;
      margin-left: 15px;
      text-decoration: none;
    }
    #selectCourse{
            width: 30%;
            padding: 40px;
            background-color: #ffffff;
            text-align: center;
            margin: auto;
            color: #2710ba;
            margin-top: 100px;
            border-radius: 50px;
    }
   
  </style>
</head>
<body>
  <div class="topnav">
    <div class="logo">Data Link SAS 🤖</div>
    <div class="nav-links">
      <a href="{{url_for('dashboard')}}">Dashboard</a>
      <a href="/register">Register</a>
      <a href="/train">Train</a>
      <a href="/select_course">Recognize</a>
      <a href="/all_schedules">Attendance</a>
      <a href="{{url_for('create_user')}}">Admin</a>
      <a href="/logout">Logout</a>
    </div>
  </div>
<div id="selectCourse">
  <h2>Select Course for Attendance</h2>
  <form id="courseForm">
    <select id="courseDropdown" required>
      <!-- Options will be populated dynamically -->
    </select>
    <button type="button" onclick="startAttendance()">Start Attendance</button>
  </form>
</div>
<script>
  // Fetch courses on DOM load
document.addEventListener('DOMContentLoaded', () => {
  fetch('/api/courses')
    .then(response => response.json())
    .then(data => {
      const courses = data.courses; 
      const select = document.getElementById('courseDropdown');
      select.innerHTML = '<option value="">Select a course...</option>'; 

  courses.forEach(course => {
  const option = document.createElement('option');
  option.value = course.name; // Send course name
  option.textContent = course.name; // Display course name
  select.appendChild(option);
});
    })
    .catch(error => {
      console.error('Error fetching courses:', error);
    });
});

// Make sure startAttendance() is globally defined
function startAttendance() {
  const select = document.getElementById('courseDropdown');
  const selectedCourseName = select.value; // value is course name
  
  if (!selectedCourseName) {
    alert('Please select a course first!');
    return;
  }
  
  // Store in sessionStorage and redirect with URL parameter
  sessionStorage.setItem('selectedCourse', selectedCourseName);
  window.location.href = "{{ url_for('recognize') }}?course_name=" + encodeURIComponent(selectedCourseName);
}

function onFaceRecognized(studentId) {
  console.log('Reporting attendance for:', {
    student_id: studentId,
    course: window.selectedCourseName
  });
  
  fetch('/submit_attendance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      student_id: studentId,
      course: window.selectedCourseName
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.status === 'success') {
      alert('Attendance marked successfully!');
    } else {
      alert('Failed to mark attendance.');
    }
  });
}
  </script>
</body>
</html>
