<!DOCTYPE html>
<html>
<head>
  <title>Auto Recognize Face</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f2f2f2;
    }
    .topnav {
      background-color: #2710ba;
      padding: 0px 20px;
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    .topnav .logo {
      font-weight: bold;
      font-size: 18px;
    }
    .topnav .nav-links a {
      color: #fff;
      margin-left: 15px;
      text-decoration: none;
    }
    .main-container {
      display: flex;
      height: calc(100vh - 60px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .loading-text {
      position: absolute;
      font-size: 24px;
      color: #333;
      margin-bottom: 30px;
    }
    .video-container {
      position: relative;
      margin-top: 50px;
      width: 100%;
      max-width: 550px;
      display: none;
    }
    #video {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
      border: 4px solid #007BFF;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }
    .right {
      margin-top: 20px;
      text-align: center;
    }
    #result {
      margin-top: 15px;
      font-size: 18px;
      color: green;
    }
  </style>
</head>
<body>
  <div class="topnav">
    <div class="logo">Data Link SAS 🤖</div>
    <div class="nav-links">
      <a href="{{url_for('dashboard')}}">Dashboard</a>
      <a href="/register">Register</a>
      <a href="/train">Train</a>
      <a href="/select_course">Recognize</a>
      <a href="/all_schedules">Attendance</a>
      <a href="{{url_for('create_user')}}">Admin</a>
      <a href="/logout">Logout</a>
    </div>
  </div>

  <div class="main-container">
    <div class="loading-text" id="loadingText">Loading models...</div>
    <div class="video-container">
      <video id="video" autoplay muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="right">
      <h2>Recognition Log</h2>
      <p id="course-info" style="font-size: 16px; color: #2710ba; margin-bottom: 10px;"></p>
      <p id="result"></p>
    </div>
  </div>

  <script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <script>
window.onload = async function () {
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const result = document.getElementById('result');
    const loadingText = document.getElementById('loadingText');
    const videoContainer = document.querySelector('.video-container');

    const urlParams = new URLSearchParams(window.location.search);
    const courseName = urlParams.get('course_name') || sessionStorage.getItem('selectedCourse');
    
    if (!courseName) {
        alert('No course selected. Please go back and select a course.');
        window.location.href = '/select_course';
        return;
    }
    
    console.log('Selected course:', courseName);
    
    // Display course name
    document.getElementById('course-info').textContent = `Taking attendance for: ${courseName}`;

    let labeledDescriptors = [];
    let faceMatcher;

    // Load Models
    await Promise.all([
        faceapi.nets.faceRecognitionNet.loadFromUri('/static/models'),
        faceapi.nets.faceLandmark68Net.loadFromUri('/static/models'),
        faceapi.nets.ssdMobilenetv1.loadFromUri('/static/models')
    ]);

    startVideo();
    await loadLabeledData();

    function startVideo() {
        navigator.mediaDevices.getUserMedia({ video: {} })
            .then(stream => {
                video.srcObject = stream;
                loadingText.style.display = 'none';
                videoContainer.style.display = 'block';
            })
            .catch(err => {
                loadingText.textContent = "Camera error: " + err.message;
            });
    }

    async function loadLabeledData() {
        const response = await fetch('/api/known_faces');
        const data = await response.json();
        labeledDescriptors = data.map(person => {
            const descriptors = person.descriptors.map(d => new Float32Array(d));
            return new faceapi.LabeledFaceDescriptors(person.label, descriptors);
        });
        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
    }

    video.addEventListener('play', () => {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        const ctx = overlay.getContext('2d');

        setInterval(async () => {
            const detections = await faceapi.detectAllFaces(video)
                .withFaceLandmarks()
                .withFaceDescriptors();

            ctx.clearRect(0, 0, overlay.width, overlay.height);

            detections.forEach(detection => {
                const match = faceMatcher.findBestMatch(detection.descriptor);
                const box = detection.detection.box;
                const text = match.toString();

                // Draw
                ctx.strokeStyle = "#00ff00";
                ctx.lineWidth = 2;
                ctx.strokeRect(box.x, box.y, box.width, box.height);
                ctx.font = "16px Arial";
                ctx.fillStyle = "red";
                ctx.fillText(text, box.x, box.y - 14);

                // Send attendance with course ID
                sendAttendance(match.label);
            });
        }, 5000);
    });

    let lastRecognizedName = null;
    let lastRecognitionTime = 0;
    let processedStudentsToday = new Set(); // Track students processed in this session
    
    function sendAttendance(name) {
        if (name === 'unknown') return;
        
        const currentTime = Date.now();
        const studentKey = `${name}_${courseName}_${new Date().toDateString()}`;
        
        // Check if student was already processed today in this session
        if (processedStudentsToday.has(studentKey)) {
            result.textContent = `🔄 ${name} already marked present today`;
            result.style.color = 'orange';
            return;
        }
        
        // Prevent rapid duplicate submissions (within 30 seconds)
        if (lastRecognizedName === name && (currentTime - lastRecognitionTime) < 30000) {
            const remainingTime = Math.ceil((30000 - (currentTime - lastRecognitionTime)) / 1000);
            result.textContent = `⏳ Cooldown active for ${name} (${remainingTime}s remaining)`;
            result.style.color = 'orange';
            return;
        }
        
        lastRecognizedName = name;
        lastRecognitionTime = currentTime;
        
        console.log('Marking attendance for:', name, 'in course:', courseName);
        result.textContent = `📝 Marking attendance for ${name}...`;
        result.style.color = 'blue';

        fetch('/api/mark_attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                course_name: courseName
            })
        })
        .then(res => res.json())
        .then(data => {
            console.log("Backend response:", data);
            if (data.status === 'success') {
                processedStudentsToday.add(studentKey); // Mark as processed
                result.textContent = `✅ Attendance marked for ${name} in ${courseName}`;
                result.style.color = 'green';
                
                // Show success for 3 seconds, then clear
                setTimeout(() => {
                    result.textContent = '';
                }, 3000);
            } else {
                result.textContent = `❌ ${data.message || 'Failed to mark attendance'}`;
                result.style.color = 'red';
                
                // If already marked, add to processed list to prevent future attempts
                if (data.message && data.message.includes('already marked')) {
                    processedStudentsToday.add(studentKey);
                }
                
                // Show error for 5 seconds, then clear
                setTimeout(() => {
                    result.textContent = '';
                }, 5000);
            }
        })
        .catch(err => {
            console.error('Error:', err);
            result.textContent = `❌ Network error: ${err.message}`;
            result.style.color = 'red';
            
            setTimeout(() => {
                result.textContent = '';
            }, 5000);
        });
    }
};
</script>

</body>
</html>
